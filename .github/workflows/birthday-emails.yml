name: Send birthday emails

on:
  schedule:
    # 01:30 UTC = 07:00 IST. Render's free tier has no built-in cron, so
    # this workflow is what actually triggers the daily check.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the birthday-emails endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ vars.VITE_API_BASE_URL }}/internal/send-birthday-emails" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Birthday-emails endpoint returned $status"
            exit 1
          fi
